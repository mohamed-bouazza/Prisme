# Configuration de pytest (lancer depuis la racine du projet : python -m pytest)
[pytest]
testpaths = cbir_api/tests gallery_backend/tests
# Dossiers ajoutés au chemin d'import :
#   cbir_api              -> "from cbir.descriptors import ...", "from app import create_app" (API CBIR)
#   gallery_backend       -> "from gallery import create_app" (backend galerie)
#   gallery_backend/tests -> "from gallery_testutils import ..." (outils de test)
pythonpath = cbir_api gallery_backend gallery_backend/tests
# importlib : deux dossiers "tests" ne se marchent pas dessus
addopts = --import-mode=importlib
